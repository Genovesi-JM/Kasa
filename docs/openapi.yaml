    LocalRentDate:
      type: string
      format: date
      pattern: '^(19|20|21)\d{2}-\d{2}-\d{2}$'
      description: A real calendar date from 1900 through 2199.
    LocalRentAmount:
      type: integer
      minimum: 1
      maximum: 100000000000
      description: AOA minor units (100 per kwanza); no fractional minor units.
    LocalRentStatus:
      enum:
        [
          awaiting_transfer,
          awaiting_confirmation,
          needs_correction,
          confirmed,
          voided,
        ]
    LocalRentTransfer:
      type: object
      required:
        [amountMinor, transferredOn, reference, note, evidenceDocumentId]
      properties:
        amountMinor: { $ref: "#/components/schemas/LocalRentAmount" }
        transferredOn: { $ref: "#/components/schemas/LocalRentDate" }
        reference: { type: string, minLength: 1, maxLength: 100 }
        note: { type: string, maxLength: 1000 }
        evidenceDocumentId: { type: [string, "null"], format: uuid }
    LocalRentSnapshot:
      type: object
      required:
        [
          amountDueMinor,
          dueOn,
          status,
          transfer,
          correctionReason,
          voidReason,
          confirmedAt,
        ]
      properties:
        amountDueMinor: { $ref: "#/components/schemas/LocalRentAmount" }
        dueOn: { $ref: "#/components/schemas/LocalRentDate" }
        status: { $ref: "#/components/schemas/LocalRentStatus" }
        transfer:
          oneOf:
            - { $ref: "#/components/schemas/LocalRentTransfer" }
            - { type: "null" }
        correctionReason: { type: [string, "null"], maxLength: 500 }
        voidReason: { type: [string, "null"], maxLength: 500 }
        confirmedAt: { type: [string, "null"], format: date-time }
    LocalRentSummary:
      allOf:
        - { $ref: "#/components/schemas/LocalRentSnapshot" }
        - type: object
          required:
            [
              id,
              propertyId,
              tenantAccountId,
              tenantName,
              period,
              currency,
              tenantAccessActive,
              version,
              createdAt,
              updatedAt,
            ]
          properties:
            id: { type: string, format: uuid }
            propertyId: { type: string, format: uuid }
            tenantAccountId: { type: string, format: uuid }
            tenantName: { type: string, minLength: 1, maxLength: 100 }
            period:
              { type: string, pattern: '^(19|20|21)\d{2}-(0[1-9]|1[0-2])$' }
            currency: { const: AOA }
            tenantAccessActive: { type: boolean }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    LocalRentRecord:
      allOf:
        - { $ref: "#/components/schemas/LocalRentSummary" }
        - type: object
          required: [history]
          properties:
            history:
              type: array
              minItems: 1
              maxItems: 100
              items:
                type: object
                required:
                  [
                    id,
                    actorId,
                    actorName,
                    kind,
                    version,
                    before,
                    after,
                    createdAt,
                  ]
                properties:
                  id: { type: string, format: uuid }
                  actorId: { type: string, format: uuid }
                  actorName: { type: string, minLength: 1, maxLength: 100 }
                  kind:
                    {
                      enum:
                        [
                          created,
                          terms_updated,
                          transfer_reported,
                          correction_requested,
                          confirmed,
                          voided,
                        ],
                    }
                  version: { type: integer, minimum: 1 }
                  before:
                    oneOf:
                      - { $ref: "#/components/schemas/LocalRentSnapshot" }
                      - { type: "null" }
                  after: { $ref: "#/components/schemas/LocalRentSnapshot" }
                  createdAt: { type: string, format: date-time }
    LocalDocument:
      type: object
      required:
        [
          id,
          propertyId,
          title,
          filename,
          mimeType,
          byteSize,
          sharing,
          recipientAccountId,
          uploadedBy,
          uploadedByName,
          version,
          archived,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 140 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        mimeType: { enum: [application/pdf, image/jpeg, image/png] }
        byteSize: { type: integer, minimum: 1, maximum: 1048576 }
        sharing: { enum: [private, shared] }
        recipientAccountId: { type: [string, "null"], format: uuid }
        uploadedBy: { type: string, format: uuid }
        uploadedByName: { type: string }
        version: { type: integer, minimum: 1 }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LocalNotification:
      type: object
      required: [id, kind, propertyId, resourceId, actorName, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          enum:
            [
              maintenance_created,
              maintenance_updated,
              document_shared,
              rent_created,
              rent_terms_updated,
              rent_transfer_reported,
              rent_correction_requested,
              rent_confirmed,
              rent_voided,
            ]
        propertyId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        actorName: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    LocalPropertyInput:
      type: object
      additionalProperties: false
      required: [name, address]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, minLength: 1, maxLength: 300 }
    LocalPrivateProperty:
      type: object
      required: [id, workspaceId, name, address, version, tenantCount]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        version: { type: integer, minimum: 1 }
        tenantCount: { type: integer, minimum: 0 }
    LocalWorkspace:
      type: object
      required: [id, name, role, version, properties]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { enum: [owner, tenant] }
        version: { type: integer, minimum: 1 }
        properties:
          type: array
          items: { $ref: "#/components/schemas/LocalPrivateProperty" }
    LocalMaintenance:
      type: object
      required:
        [
          id,
          propertyId,
          title,
          description,
          priority,
          status,
          version,
          createdAt,
          updatedAt,
          createdBy,
          history,
        ]
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        priority: { enum: [normal, urgent] }
        status: { enum: [open, in_progress, resolved] }
        version: { type: integer, minimum: 1 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            required: [id, actorId, actorName, kind, message, status, createdAt]
            properties:
              id: { type: string, format: uuid }
              actorId: { type: string, format: uuid }
              actorName: { type: string }
              kind: { enum: [created, status_changed, comment] }
              message: { type: string }
              status: { enum: [open, in_progress, resolved] }
              createdAt: { type: string, format: date-time }
    AccountLocale:
      enum: [pt, en, es, fr, ar, zh]
    LocalAccount:
      type: object
      additionalProperties: false
      required: [id, displayName, email, locale, version, emailVerified]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        locale: { $ref: "#/components/schemas/AccountLocale" }
        version: { type: integer, minimum: 1 }
        emailVerified: { const: false }
    LocalAccountSession:
      oneOf:
        - type: object
          required: [account, csrfToken]
          properties:
            account: { $ref: "#/components/schemas/LocalAccount" }
            csrfToken: { type: string }
        - type: object
          required: [account, csrfToken]
          properties:
            account: { type: "null" }
            csrfToken: { type: "null" }
    CountryConfig:
      type: object
      required:
        [country, currency, capabilityScope, features, readiness, launch]
      properties:
        country: { type: string, minLength: 2, maxLength: 12 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        capabilityScope: { const: synthetic_demo }
        readiness: { enum: [demo, requires_market_approval] }
        features:
          type: object
          required:
            [
              propertyDiscovery,
              propertyOperations,
              services,
              spacesSports,
              spacesEvents,
              overnightSpaces,
              rentCustody,
              depositCustody,
              propertySuccessFees,
              partyRepresentation,
              mortgageIntermediation,
              externalVenuePayments,
            ]
          properties:
            propertyDiscovery: { type: boolean }
            propertyOperations: { type: boolean }
            services: { type: boolean }
            spacesSports: { type: boolean }
            spacesEvents: { type: boolean }
            overnightSpaces: { const: false }
            rentCustody: { const: false }
            depositCustody: { const: false }
            propertySuccessFees: { const: false }
            partyRepresentation: { const: false }
            mortgageIntermediation: { const: false }
            externalVenuePayments: { const: false }
        launch:
          type: object
          required: [status, productionReady, liveCapabilities, gates]
          properties:
            status: { const: blocked }
            productionReady: { const: false }
            liveCapabilities:
              type: object
              required:
                [
                  propertyPublication,
                  paidPropertyPromotion,
                  liveSpaceBookings,
                  jobPublication,
                  connectedPayments,
                ]
              properties:
                propertyPublication: { const: false }
                paidPropertyPromotion: { const: false }
                liveSpaceBookings: { const: false }
                jobPublication: { const: false }
                connectedPayments: { const: false }
            gates:
              type: object
              required:
                [
                  propertyClassification,
                  privacyHosting,
                  paymentsTax,
                  trustSafety,
                  productionSystems,
                ]
              properties:
                propertyClassification: { const: pending }
                privacyHosting: { const: pending }
                paymentsTax: { const: pending }
                trustSafety: { const: pending }
                productionSystems: { const: pending }
    ApiError:
      type: object
      required: [message, requestId]
      properties:
        message: { type: string }
        requestId: { type: string }
        issues:
          type: array
          items: { type: object }
  responses:
    LocalRentMutationResult:
      description: >-
        Current authorized saved record and history, with replayed true for an identical
        previous logical action. Cache-Control no-store. No payment or bank verification.
      content:
        application/json:
          schema:
            type: object
            required: [record, replayed]
            properties:
              record: { $ref: "#/components/schemas/LocalRentRecord" }
              replayed: { type: boolean }
    LocalDocumentResult:
      description: Saved metadata only; no file bytes, public URL or private contact details
      content:
        application/json:
          schema:
            type: object
            required: [document]
            properties:
              document: { $ref: "#/components/schemas/LocalDocument" }
    LocalPropertyResult:
      description: Saved private property; Cache-Control no-store
      content:
        application/json:
          schema:
            type: object
            required: [property]
            properties:
              property: { $ref: "#/components/schemas/LocalPrivateProperty" }
    LocalMaintenanceResult:
      description: Saved maintenance request and history; Cache-Control no-store
      content:
        application/json:
          schema:
            type: object
            required: [request]
            properties:
              request: { $ref: "#/components/schemas/LocalMaintenance" }
    AccountSession:
      description: Local account session; Cache-Control no-store, workspace permissions resolved separately
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LocalAccountSession" }
    AccountFailure:
      description: >-
        Account request failed; nested error.code and error.message. Origin/global
        API middleware may return the standard ApiError instead. Disabled accounts
        return 503. Never retry a mutation automatically after an unknown outcome.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ApiError"
              - type: object
                required: [error]
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string }
                      message: { type: string }
                      fields: { type: object }
                  requestId: { type: string }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: Missing or invalid demo API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: The supplied Origin is not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    IdempotencyConflict:
      description: This key was used with a different validated payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLarge:
      description: JSON request body exceeds 250 KB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    RateLimited:
      description: API request quota exceeded; retry after the reported limit resets
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
